method: random
metric:
  name: rmse_test
  goal: minimize
parameters:
  criterion:
    distribution: categorical
    values: ['squared_error', 'absolute_error']
  max_depth:
    distribution: int_uniform
    max: 38
    min: 2
  min_samples_leaf:
    distribution: int_uniform
    max: 5
    min: 1
  min_samples_split:
    distribution: int_uniform
    max: 10
    min: 2
  n_estimators:
    distribution: int_uniform
    max: 750
    min: 25
program: frp_rdForest.py
