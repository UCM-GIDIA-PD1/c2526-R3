program: arbolesDecision.py
entity: pd1-c2526-team3
project: arboles-decision-sweeps
name : sweep_random_forest
method: bayes
metric:
  name: f1_5_score
  goal: maximize
parameters:
  n_estimators:
    values: [50, 100, 200, 250, 400, 500, 600, 750, 850, 1000]
  max_depth:
    distribution: int_uniform
    min: 3
    max: 20
  min_samples_split:
    distribution: int_uniform
    min: 2
    max: 10
  min_samples_leaf:
    distribution: int_uniform
    min: 1
    max: 10
  class_weight:
    values: ['balanced_subsample', 'balanced']
  criterion:
    values: ['gini', 'entropy']