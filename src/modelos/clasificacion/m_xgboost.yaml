name: sweep-xgboost-incendios
method: random 
metric:
  name: val/f2_mean_cv
  goal: maximize

parameters:
  n_estimators:
    values: [100, 500, 1000, 2000, 5000]
  
  learning_rate:
    distribution: uniform
    min: 0.01
    max: 0.2
  
  max_depth:
    values: [3, 6, 9, 12]
  
  subsample:
    distribution: uniform
    min: 0.6
    max: 1.0

  colsample_bytree:
    distribution: uniform
    min: 0.5
    max: 1.0

  criterion:
    values: ['gini', 'entropy']

  umbral:
    distribution: uniform
    min: 0.1
    max: 0.5