program: random_forest.py
entity: pd1-c2526-team3
project: sweep_random_forest_umbral_smote
name: sweep_random_forest
method: bayes
metric:
  name: f1_5_score
  goal: maximize
parameters:
  n_estimators:
    values: [100, 200, 300, 400, 500,600,700,800,900] 
  max_depth:
    distribution: int_uniform
    min: 5
    max: 35      
  min_samples_leaf:
    distribution: int_uniform
    min: 1
    max: 10 
  min_samples_split:
    distribution: int_uniform
    min: 2
    max: 18      
  criterion:
    values: ['gini', 'entropy']
  max_features:
    values: ['sqrt', 'log2', 'None']
  umbral:
    distribution: uniform
    min: 0.23
    max: 0.6
  class_weight:
    values: ['balanced', 'balanced_subsample']